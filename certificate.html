    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

        :root {
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #ffffff;
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            background-color: #050505;
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            margin: 0;
        }

        /* ===== Floating lines shader background ===== */
        #floating-lines-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: auto;
            mix-blend-mode: screen;
        }

        #floating-lines-bg canvas {
            display: block;
        }

        .nav-pill {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 8px 12px;
            border-radius: 100px;
        }

        .nav-link {
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #999;
            transition: 0.3s;
            white-space: nowrap;
        }

        .nav-link:hover, .nav-link.active {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .page-title {
            font-size: clamp(2rem, 7vw, 3rem);
        }

        /* ===== Compartment (accordion) ===== */
        .compartment {
            margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
        }

        .compartment-header {
            width: 100%;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: clamp(10px, 2vw, 14px) clamp(16px, 4vw, 30px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 0;
            cursor: pointer;
            color: white;
            font-family: inherit;
            transition: 0.3s;
        }

        .compartment-header:hover {
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.06);
        }

        .compartment-name {
            text-transform: uppercase;
            letter-spacing: clamp(1px, 0.6vw, 4px);
            font-weight: 800;
            font-size: clamp(0.75rem, 2.5vw, 1rem);
        }

        .compartment-count {
            font-size: 0.7rem;
            font-weight: 600;
            color: #999;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 100px;
            padding: 2px 10px;
        }

        .compartment-chevron {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .compartment.open .compartment-chevron {
            transform: rotate(180deg);
        }

        .compartment-body {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.55s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .compartment.open .compartment-body {
            grid-template-rows: 1fr;
        }

        .compartment-body-inner {
            overflow: hidden;
        }

        .loop-container {
            overflow: hidden;
            width: 100%;
            mask-image: linear-gradient(to right, transparent, black 6%, black 94%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 6%, black 94%, transparent);
            padding: clamp(14px, 3vw, 24px) 0;
        }

        .loop-track {
            display: flex;
            gap: clamp(14px, 2.5vw, 24px);
            width: max-content;
        }

        .loop-track.scrolling {
            animation: scroll 60s linear infinite;
        }

        .loop-track.scrolling:hover {
            animation-play-state: paused;
        }

        .static-track {
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .ui-card {
            width: clamp(150px, 42vw, 300px);
            height: clamp(105px, 29vw, 200px);
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: clamp(12px, 2vw, 24px);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            flex-shrink: 0;
        }

        .ui-card:hover, .ui-card:active {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .ui-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
            transition: 0.3s;
        }

        #mobile-overlay {
            position: fixed;
            inset: 0;
            z-index: 90;
            background: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.75rem;
            clip-path: circle(0% at 100% 0%);
            transition: clip-path 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            pointer-events: none;
            padding: 2rem;
            text-align: center;
        }

        #mobile-overlay.open {
            clip-path: circle(150% at 100% 0%);
            pointer-events: auto;
        }

        #mobile-overlay a {
            font-size: clamp(1.5rem, 8vw, 2.25rem);
        }

        #cert-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(15px);
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #cert-modal.open { display: flex; }
        #modal-img {
            max-width: 92vw;
            max-height: 65vh;
            width: auto;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(255,255,255,0.1);
        }

        #modal-actions {
            margin-top: clamp(1.25rem, 4vw, 2rem);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #modal-actions button {
            font-size: 0.7rem;
            padding: 14px 22px;
        }

        @media (max-width: 480px) {
            .compartment-header { border-radius: 16px; }
            .ui-card { border-radius: 14px; }
        }
    </style>
</head>

        function initGallery() {
            const main = document.getElementById('main-content');
            let first = true;

            Object.keys(certData).forEach(catName => {
                const items = certData[catName];
                const slug = catName.replace(/\s+/g, '-').toLowerCase();
                const trackId = `track-${slug}`;
                const isScrolling = items.length > 3;

                const section = document.createElement('section');
                section.className = 'compartment' + (first ? ' open' : '');
                section.id = `compartment-${slug}`;

                section.innerHTML = `
                    <button class="compartment-header" onclick="toggleCompartment('${slug}')" type="button">
                        <i data-lucide="chevron-down" class="compartment-chevron"></i>
                        <span class="compartment-name">${catName}</span>
                        <span class="compartment-count">${items.length}</span>
                    </button>
                    <div class="compartment-body">
                        <div class="compartment-body-inner">
                            <div class="loop-container">
                                <div class="loop-track ${isScrolling ? 'can-scroll' : 'static-track'} ${(isScrolling && first) ? 'scrolling' : ''}" id="${trackId}"></div>
                            </div>
                        </div>
                    </div>
                `;
                main.appendChild(section);

                const track = document.getElementById(trackId);
                const displayItems = isScrolling ? [...items, ...items] : items;

                displayItems.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'ui-card';
                    card.innerHTML = `<img src="${item.src}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x200?text=${encodeURIComponent(catName)}'">`;
                    card.onclick = () => openModal(item.src);
                    track.appendChild(card);
                });

                first = false;
            });

            lucide.createIcons();
        }

        function toggleCompartment(slug) {
            const section = document.getElementById(`compartment-${slug}`);
            if (!section) return;
            const track = document.getElementById(`track-${slug}`);
            const isOpening = !section.classList.contains('open');

            section.classList.toggle('open', isOpening);

            if (track && track.classList.contains('can-scroll')) {
                track.classList.toggle('scrolling', isOpening);
            }
        }

        function toggleMenu() {
            const overlay = document.getElementById('mobile-overlay');
            const icon = document.getElementById('menu-icon');
            overlay.classList.toggle('open');
            icon.setAttribute('data-lucide', overlay.classList.contains('open') ? 'x' : 'menu');
            lucide.createIcons();
        }

        function openModal(src) {
            const modalImg = document.getElementById('modal-img');
            modalImg.src = src;
            document.getElementById('cert-modal').classList.add('open');
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('cert-modal').classList.remove('open');
            document.body.style.overflow = 'auto';
        }

        async function downloadAsPDF() {
            const imgElement = document.getElementById('modal-img');
            const btn = document.getElementById('download-pdf-btn');
            const originalHTML = btn.innerHTML;
            btn.innerText = "GENERATING...";

            if (!imgElement.complete || imgElement.naturalWidth === 0) {
                alert("Image not loaded yet.");
                btn.innerHTML = originalHTML;
                lucide.createIcons();
                return;
            }

            try {
                const fileName = imgElement.src.split('/').pop().split('.')[0];
                const response = await fetch(imgElement.src);
                const blob = await response.blob();
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = function() {
                    const base64data = reader.result;
                    const { jsPDF } = window.jspdf;
                    const orientation = imgElement.naturalWidth > imgElement.naturalHeight ? 'l' : 'p';
                    const pdf = new jsPDF({
                        orientation: orientation,
                        unit: 'px',
                        format: [imgElement.naturalWidth, imgElement.naturalHeight]
                    });
                    pdf.addImage(base64data, 'JPEG', 0, 0, imgElement.naturalWidth, imgElement.naturalHeight);
                    pdf.save(fileName + ".pdf");
                    btn.innerHTML = originalHTML;
                    lucide.createIcons();
                };
            } catch (error) {
                btn.innerHTML = originalHTML;
                lucide.createIcons();
            }
        }

        window.onload = () => {
            initGallery();
            lucide.createIcons();
        };

    <!-- ===== FloatingLines background (vanilla JS / Three.js port) ===== -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <script type="module">
        import * as THREE from "three";

        const vertexShader = `
            precision highp float;
            void main() {
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            precision highp float;

            uniform float iTime;
            uniform vec3  iResolution;
            uniform float animationSpeed;

            uniform bool enableTop;
            uniform bool enableMiddle;
            uniform bool enableBottom;

            uniform int topLineCount;
            uniform int middleLineCount;
            uniform int bottomLineCount;

            uniform float topLineDistance;
            uniform float middleLineDistance;
            uniform float bottomLineDistance;

            uniform vec3 topWavePosition;
            uniform vec3 middleWavePosition;
            uniform vec3 bottomWavePosition;

            uniform vec2 iMouse;
            uniform bool interactive;
            uniform float bendRadius;
            uniform float bendStrength;
            uniform float bendInfluence;

            uniform bool parallax;
            uniform float parallaxStrength;
            uniform vec2 parallaxOffset;

            uniform vec3 lineGradient[8];
            uniform int lineGradientCount;

            const vec3 BLACK = vec3(0.0);
            const vec3 PINK  = vec3(233.0, 71.0, 245.0) / 255.0;
            const vec3 BLUE  = vec3(47.0,  75.0, 162.0) / 255.0;

            mat2 rotate(float r) {
                return mat2(cos(r), sin(r), -sin(r), cos(r));
            }

            vec3 background_color(vec2 uv) {
                vec3 col = vec3(0.0);
                float y = sin(uv.x - 0.2) * 0.3 - 0.1;
                float m = uv.y - y;
                col += mix(BLUE, BLACK, smoothstep(0.0, 1.0, abs(m)));
                col += mix(PINK, BLACK, smoothstep(0.0, 1.0, abs(m - 0.8)));
                return col * 0.5;
            }

            vec3 getLineColor(float t, vec3 baseColor) {
                if (lineGradientCount <= 0) {
                    return baseColor;
                }
                vec3 gradientColor;
                if (lineGradientCount == 1) {
                    gradientColor = lineGradient[0];
                } else {
                    float clampedT = clamp(t, 0.0, 0.9999);
                    float scaled = clampedT * float(lineGradientCount - 1);
                    int idx = int(floor(scaled));
                    float f = fract(scaled);
                    int idx2 = min(idx + 1, lineGradientCount - 1);
                    vec3 c1 = lineGradient[idx];
                    vec3 c2 = lineGradient[idx2];
                    gradientColor = mix(c1, c2, f);
                }
                return gradientColor * 0.5;
            }

            float wave(vec2 uv, float offset, vec2 screenUv, vec2 mouseUv, bool shouldBend) {
                float time = iTime * animationSpeed;
                float x_offset   = offset;
                float x_movement = time * 0.1;
                float amp        = sin(offset + time * 0.2) * 0.3;
                float y          = sin(uv.x + x_offset + x_movement) * amp;

                if (shouldBend) {
                    vec2 d = screenUv - mouseUv;
                    float influence = exp(-dot(d, d) * bendRadius);
                    float bendOffset = (mouseUv.y - screenUv.y) * influence * bendStrength * bendInfluence;
                    y += bendOffset;
                }

                float m = uv.y - y;
                return 0.0175 / max(abs(m) + 0.01, 1e-3) + 0.01;
            }

            void mainImage(out vec4 fragColor, in vec2 fragCoord) {
                vec2 baseUv = (2.0 * fragCoord - iResolution.xy) / iResolution.y;
                baseUv.y *= -1.0;

                if (parallax) {
                    baseUv += parallaxOffset;
                }

                vec3 col = vec3(0.0);
                vec3 b = lineGradientCount > 0 ? vec3(0.0) : background_color(baseUv);

                vec2 mouseUv = vec2(0.0);
                if (interactive) {
                    mouseUv = (2.0 * iMouse - iResolution.xy) / iResolution.y;
                    mouseUv.y *= -1.0;
                }

                if (enableBottom) {
                    for (int i = 0; i < 32; ++i) {
                        if (i >= bottomLineCount) break;
                        float fi = float(i);
                        float t = fi / max(float(bottomLineCount - 1), 1.0);
                        vec3 lineCol = getLineColor(t, b);
                        float angle = bottomWavePosition.z * log(length(baseUv) + 1.0);
                        vec2 ruv = baseUv * rotate(angle);
                        col += lineCol * wave(
                            ruv + vec2(bottomLineDistance * fi + bottomWavePosition.x, bottomWavePosition.y),
                            1.5 + 0.2 * fi, baseUv, mouseUv, interactive
                        ) * 0.2;
                    }
                }

                if (enableMiddle) {
                    for (int i = 0; i < 32; ++i) {
                        if (i >= middleLineCount) break;
                        float fi = float(i);
                        float t = fi / max(float(middleLineCount - 1), 1.0);
                        vec3 lineCol = getLineColor(t, b);
                        float angle = middleWavePosition.z * log(length(baseUv) + 1.0);
                        vec2 ruv = baseUv * rotate(angle);
                        col += lineCol * wave(
                            ruv + vec2(middleLineDistance * fi + middleWavePosition.x, middleWavePosition.y),
                            2.0 + 0.15 * fi, baseUv, mouseUv, interactive
                        );
                    }
                }

                if (enableTop) {
                    for (int i = 0; i < 32; ++i) {
                        if (i >= topLineCount) break;
                        float fi = float(i);
                        float t = fi / max(float(topLineCount - 1), 1.0);
                        vec3 lineCol = getLineColor(t, b);
                        float angle = topWavePosition.z * log(length(baseUv) + 1.0);
                        vec2 ruv = baseUv * rotate(angle);
                        ruv.x *= -1.0;
                        col += lineCol * wave(
                            ruv + vec2(topLineDistance * fi + topWavePosition.x, topWavePosition.y),
                            1.0 + 0.2 * fi, baseUv, mouseUv, interactive
                        ) * 0.1;
                    }
                }

                fragColor = vec4(col, 1.0);
            }

            void main() {
                vec4 color = vec4(0.0);
                mainImage(color, gl_FragCoord.xy);
                gl_FragColor = color;
            }
        `;

        const MAX_GRADIENT_STOPS = 8;

        function hexToVec3(hex) {
            let value = hex.trim();
            if (value.startsWith('#')) value = value.slice(1);
            let r = 255, g = 255, b = 255;
            if (value.length === 3) {
                r = parseInt(value[0] + value[0], 16);
                g = parseInt(value[1] + value[1], 16);
                b = parseInt(value[2] + value[2], 16);
            } else if (value.length === 6) {
                r = parseInt(value.slice(0, 2), 16);
                g = parseInt(value.slice(2, 4), 16);
                b = parseInt(value.slice(4, 6), 16);
            }
            return new THREE.Vector3(r / 255, g / 255, b / 255);
        }

        function initFloatingLines(container, opts = {}) {
            if (!container || !window.WebGLRenderingContext) return () => {};

            const {
                linesGradient,
                enabledWaves = ['top', 'middle', 'bottom'],
                lineCount = 6,
                lineDistance = 5,
                topWavePosition,
                middleWavePosition,
                bottomWavePosition = { x: 2.0, y: -0.7, rotate: -1 },
                animationSpeed = 1,
                interactive = true,
                bendRadius = 5.0,
                bendStrength = -0.5,
                mouseDamping = 0.05,
                parallax = true,
                parallaxStrength = 0.2
            } = opts;

            const getLineCount = (waveType) => {
                if (typeof lineCount === 'number') return lineCount;
                if (!enabledWaves.includes(waveType)) return 0;
                const idx = enabledWaves.indexOf(waveType);
                return lineCount[idx] ?? 6;
            };
            const getLineDistance = (waveType) => {
                if (typeof lineDistance === 'number') return lineDistance;
                if (!enabledWaves.includes(waveType)) return 0.1;
                const idx = enabledWaves.indexOf(waveType);
                return lineDistance[idx] ?? 0.1;
            };

            const topLineCount = enabledWaves.includes('top') ? getLineCount('top') : 0;
            const middleLineCount = enabledWaves.includes('middle') ? getLineCount('middle') : 0;
            const bottomLineCount = enabledWaves.includes('bottom') ? getLineCount('bottom') : 0;

            const topLineDistance = enabledWaves.includes('top') ? getLineDistance('top') * 0.01 : 0.01;
            const middleLineDistance = enabledWaves.includes('middle') ? getLineDistance('middle') * 0.01 : 0.01;
            const bottomLineDistance = enabledWaves.includes('bottom') ? getLineDistance('bottom') * 0.01 : 0.01;

            let active = true;
            let raf = 0;

            const scene = new THREE.Scene();
            const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            camera.position.z = 1;

            let renderer;
            try {
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            } catch (e) {
                return () => {};
            }
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.domElement.style.width = '100%';
            renderer.domElement.style.height = '100%';
            container.appendChild(renderer.domElement);

            const uniforms = {
                iTime: { value: 0 },
                iResolution: { value: new THREE.Vector3(1, 1, 1) },
                animationSpeed: { value: animationSpeed },
                enableTop: { value: enabledWaves.includes('top') },
                enableMiddle: { value: enabledWaves.includes('middle') },
                enableBottom: { value: enabledWaves.includes('bottom') },
                topLineCount: { value: topLineCount },
                middleLineCount: { value: middleLineCount },
                bottomLineCount: { value: bottomLineCount },
                topLineDistance: { value: topLineDistance },
                middleLineDistance: { value: middleLineDistance },
                bottomLineDistance: { value: bottomLineDistance },
                topWavePosition: { value: new THREE.Vector3(topWavePosition?.x ?? 10.0, topWavePosition?.y ?? 0.5, topWavePosition?.rotate ?? -0.4) },
                middleWavePosition: { value: new THREE.Vector3(middleWavePosition?.x ?? 5.0, middleWavePosition?.y ?? 0.0, middleWavePosition?.rotate ?? 0.2) },
                bottomWavePosition: { value: new THREE.Vector3(bottomWavePosition?.x ?? 2.0, bottomWavePosition?.y ?? -0.7, bottomWavePosition?.rotate ?? 0.4) },
                iMouse: { value: new THREE.Vector2(-1000, -1000) },
                interactive: { value: interactive },
                bendRadius: { value: bendRadius },
                bendStrength: { value: bendStrength },
                bendInfluence: { value: 0 },
                parallax: { value: parallax },
                parallaxStrength: { value: parallaxStrength },
                parallaxOffset: { value: new THREE.Vector2(0, 0) },
                lineGradient: { value: Array.from({ length: MAX_GRADIENT_STOPS }, () => new THREE.Vector3(1, 1, 1)) },
                lineGradientCount: { value: 0 }
            };

            if (linesGradient && linesGradient.length > 0) {
                const stops = linesGradient.slice(0, MAX_GRADIENT_STOPS);
                uniforms.lineGradientCount.value = stops.length;
                stops.forEach((hex, i) => {
                    const c = hexToVec3(hex);
                    uniforms.lineGradient.value[i].set(c.x, c.y, c.z);
                });
            }

            const material = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader });
            const geometry = new THREE.PlaneGeometry(2, 2);
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            const clock = new THREE.Clock();
            const targetMouse = new THREE.Vector2(-1000, -1000);
            const currentMouse = new THREE.Vector2(-1000, -1000);
            let targetInfluence = 0, currentInfluence = 0;
            const targetParallax = new THREE.Vector2(0, 0);
            const currentParallax = new THREE.Vector2(0, 0);

            const setSize = () => {
                if (!active) return;
                const width = container.clientWidth || 1;
                const height = container.clientHeight || 1;
                renderer.setSize(width, height, false);
                uniforms.iResolution.value.set(renderer.domElement.width, renderer.domElement.height, 1);
            };
            setSize();

            const ro = typeof ResizeObserver !== 'undefined'
                ? new ResizeObserver(() => active && setSize())
                : null;
            if (ro) ro.observe(container);
            window.addEventListener('resize', setSize);

            function handlePointerMove(e) {
                const rect = renderer.domElement.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const dpr = renderer.getPixelRatio();
                targetMouse.set(x * dpr, (rect.height - y) * dpr);
                targetInfluence = 1.0;
                if (parallax) {
                    const cx = rect.width / 2, cy = rect.height / 2;
                    const ox = (x - cx) / rect.width;
                    const oy = -(y - cy) / rect.height;
                    targetParallax.set(ox * parallaxStrength, oy * parallaxStrength);
                }
            }
            function handlePointerLeave() { targetInfluence = 0.0; }

            if (interactive) {
                renderer.domElement.addEventListener('pointermove', handlePointerMove);
                renderer.domElement.addEventListener('pointerleave', handlePointerLeave);
            }

            function renderLoop() {
                if (!active) return;
                uniforms.iTime.value = clock.getElapsedTime();
                if (interactive) {
                    currentMouse.lerp(targetMouse, mouseDamping);
                    uniforms.iMouse.value.copy(currentMouse);
                    currentInfluence += (targetInfluence - currentInfluence) * mouseDamping;
                    uniforms.bendInfluence.value = currentInfluence;
                }
                if (parallax) {
                    currentParallax.lerp(targetParallax, mouseDamping);
                    uniforms.parallaxOffset.value.copy(currentParallax);
                }
                renderer.render(scene, camera);
                raf = requestAnimationFrame(renderLoop);
            }
            renderLoop();

            return function destroy() {
                active = false;
                cancelAnimationFrame(raf);
                if (ro) ro.disconnect();
                window.removeEventListener('resize', setSize);
                if (interactive) {
                    renderer.domElement.removeEventListener('pointermove', handlePointerMove);
                    renderer.domElement.removeEventListener('pointerleave', handlePointerLeave);
                }
                geometry.dispose();
                material.dispose();
                renderer.dispose();
                renderer.forceContextLoss();
                if (renderer.domElement.parentElement) {
                    renderer.domElement.parentElement.removeChild(renderer.domElement);
                }
            };
        }

        const container = document.getElementById('floating-lines-bg');
        const isSmallScreen = window.matchMedia('(max-width: 768px)').matches;
        const isCoarsePointer = window.matchMedia('(pointer: coarse)').matches;

        try {
            initFloatingLines(container, {
                enabledWaves: ["top", "middle", "bottom"],
                lineCount: isSmallScreen ? 4 : 8,
                lineDistance: isSmallScreen ? 6 : 8,
                bendRadius: 8,
                bendStrength: -2,
                interactive: !isCoarsePointer,
                parallax: !isCoarsePointer,
                animationSpeed: 1,
                linesGradient: ["#6c1572", "#251ff6", "#6a6a6a"]
            });
        } catch (e) {
            // Silently skip the background effect if WebGL isn't available.
        }
    </script>
</body>
</html>
